[project]
name = "rs-agent"
version = "3.1.0"
description = "遥感多模态智能分析助手 — LLM + Function Calling for remote sensing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "rasterio>=1.3",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "segment-anything",
    "fastapi>=0.110",
    "uvicorn>=0.25",
    "fiona>=1.9",
    "earthengine-api",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "openai>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.25",
]

[project.scripts]
rs-agent = "main:main"
rs-server = "app:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
