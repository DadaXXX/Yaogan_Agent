<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小遥 · 遥感智能助手</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; background:#f5f5f7; color:#1d1d1f; height:100vh; display:flex; }
/* 侧边栏 */
aside { width:240px; background:#fff; border-right:1px solid #e5e5e7; display:flex; flex-direction:column; padding:24px 0; flex-shrink:0; }
aside .logo { padding:0 20px 20px; font-size:20px; font-weight:700; color:#1d1d1f; letter-spacing:-0.5px; }
aside .logo span { color:#0071e3; }
aside nav a { display:block; padding:10px 20px; color:#555; text-decoration:none; font-size:14px; transition:.15s; }
aside nav a:hover, aside nav a.active { background:#f0f0f5; color:#1d1d1f; }
aside .tools-box { flex:1; overflow-y:auto; padding:16px 20px; }
aside .tools-box h3 { font-size:11px; text-transform:uppercase; color:#999; margin-bottom:8px; letter-spacing:1px; }
aside .tools-box .tag { display:inline-block; font-size:11px; padding:3px 8px; margin:2px 3px 2px 0; border-radius:10px; background:#f0f0f5; color:#666; }
aside .tools-box .tag:hover { background:#e0e0ea; }
/* 主窗口 */
main { flex:1; display:flex; flex-direction:column; max-width:860px; margin:0 auto; width:100%; }
.chat { flex:1; overflow-y:auto; padding:32px 24px; }
/* 消息气泡 */
.msg-row { display:flex; margin-bottom:20px; }
.msg-row.you { justify-content:flex-end; }
.avatar { width:36px; height:36px; border-radius:50%; margin-right:10px; flex-shrink:0; font-size:16px; line-height:36px; text-align:center; }
.msg-row.assistant .avatar { background:#e8f0fe; color:#0071e3; }
.msg-row.you .avatar { background:#0071e3; color:#fff; margin-right:0; margin-left:10px; order:1; }
.bubble { max-width:75%; padding:12px 16px; border-radius:16px; font-size:14.5px; line-height:1.6; word-break:break-word; }
.msg-row.assistant .bubble { background:#fff; border:1px solid #e5e5e7; border-radius:4px 16px 16px 16px; white-space:pre-wrap; }
.msg-row.you .bubble { background:#0071e3; color:#fff; border-radius:16px 4px 16px 16px; }
/* 底部输入 */
footer { background:#fff; border-top:1px solid #e5e5e7; padding:16px 24px; }
footer .input-box { max-width:800px; margin:0 auto; display:flex; gap:10px; align-items:center; background:#f5f5f7; border-radius:24px; padding:6px 6px 6px 20px; }
footer .input-box input { flex:1; border:none; background:transparent; font-size:15px; outline:none; color:#1d1d1f; }
footer .input-box input::placeholder { color:#aaa; }
footer .input-box button { width:40px; height:40px; border:none; border-radius:50%; background:#0071e3; color:#fff; font-size:18px; cursor:pointer; flex-shrink:0; transition:.15s; }
footer .input-box button:hover { background:#0060c0; transform:scale(1.05); }
footer .hint { text-align:center; font-size:11px; color:#aaa; margin-top:8px; }
</style>
</head>
<body>

<aside>
<div class="logo">小遥<span>.</span>遥感助手</div>
<nav>
<a class="active" href="#">对话分析</a>
<a href="#">数据管理</a>
<a href="#">输出影像</a>
<a href="#">设置</a>
</nav>
<div class="tools-box"><h3>可用工具</h3><div id="tags"></div></div>
</aside>

<main>
<div class="chat" id="chat">
<div class="msg-row assistant">
<div class="avatar">🌏</div>
<div class="bubble">你好！我是小遥，你的遥感助手。<br>告诉我你想分析什么 —— 比如计算 NDVI、搜索下载卫星影像、做变化检测，或者你对遥感数据分析有任何问题，我们都可以一起解决。</div>
</div>
</div>
<footer>
<div class="input-box">
<input id="input" placeholder="输入你的问题，比如「帮我算一下这张影像的 NDVI」" onkeydown="if(event.key==='Enter')send(event)">
<button onclick="send(event)">↑</button>
</div>
<div class="hint">小遥可以帮你获取数据、分析影像、分类识别、变化检测</div>
</footer>
</main>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sid = Math.random().toString(36).slice(2);

async function send(e) {
e.preventDefault();
const msg = input.value.trim();
if(!msg) return;

// 添加用户消息
chat.innerHTML += '<div class="msg-row you"><div class="avatar">👤</div><div class="bubble">'+msg+'</div></div>';
input.value = '';

// 添加加载动画
const loadId = 'load_'+Date.now();
chat.innerHTML += '<div class="msg-row assistant" id="'+loadId+'"><div class="avatar">🌏</div><div class="bubble">分析中...</div></div>';
chat.scrollTop = chat.scrollHeight;

try {
const res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,session_id:sid})});
const data = await res.json();
// 替换加载消息
const el = document.getElementById(loadId);
if(el) el.querySelector('.bubble').textContent = data.reply;
} catch(e) {
const el = document.getElementById(loadId);
if(el) el.querySelector('.bubble').textContent = '网络出错了，检查一下服务是否在运行。';
}
chat.scrollTop = chat.scrollHeight;
}

// 加载工具标签
fetch('/api/tools').then(r=>r.json()).then(d=>{
document.getElementById('tags').innerHTML = d.tools.map(t=>'<span class="tag">'+t+'</span>').join('');
});
</script>
</body>
</html>
